services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: movies
      MYSQL_PASSWORD: movies
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_USER: movies
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umovies", "-pmovies"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  database_data:
  elasticsearch_data:
